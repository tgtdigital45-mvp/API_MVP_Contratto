version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: marketplace-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - marketplace-network

  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - marketplace-network

  api:
    build: .
    container_name: marketplace-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SNOWFLAKE_NODE_ID=${SNOWFLAKE_NODE_ID}
    depends_on:
      - postgres
      - redis
    networks:
      - marketplace-network

volumes:
  pgdata:
  redisdata:

networks:
  marketplace-network:
    driver: bridge